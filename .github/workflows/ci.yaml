name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 17, 25 ]
    name: Java ${{ matrix.java }} build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven on JDK ${{ matrix.java }}
        run: mvn --batch-mode --update-snapshots verify

      - name: Test deployment trigger
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  deploy:
    name: Deploy tested commit
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: coolify-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Trigger deployment
        env:
          COOLIFY_DEPLOY_CONFIG: ${{ secrets.COOLIFY_DEPLOY_CONFIG }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deploy.py
